baseURL: "https://agit-internet.github.io/"
title: "GalaxyVortex's blog"
locale: "zh-CN"
defaultContentLanguage: "zh"
hasCJKLanguage: true
timeZone: "Asia/Shanghai"
theme: "PaperMod"
enableRobotsTXT: true

pagination:
  pagerSize: 8

permalinks:
  posts: "/posts/:slug/"

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  author: "GalaxyVortex"
  description: "希望在本科期间产生不错的impact。"
  defaultTheme: auto
  label:
    icon: "images/avatar.jpg"
    iconHeight: 32
  mainSections: [posts]
  DateFormat: "2006.01.02"
  disableSpecial1stPost: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  comments: true
  giscus:
    enabled: true
    repo: "AGIT-Internet/agit-internet.github.io"
    repoID: "R_kgDOVBN3wg"
    category: "Announcements"
    categoryID: "DIC_kwDOVBN3ws4DHWMF"
  homeInfoParams:
    Title: "在地球Online中探索意义"
    Content: "原谅我这一生不羁放纵爱自由"
  fuseOpts:
    ignoreLocation: true
    threshold: 0.3
    minMatchCharLength: 1
    keys: [title, summary, content]
  assets:
    favicon: "/icons/avatar-256.png"
    favicon16x16: "/icons/avatar-16.png"
    favicon32x32: "/icons/avatar-32.png"
    apple_touch_icon: "/icons/avatar-180.png"
    safari_pinned_tab: "/avatar.svg"
    theme_color: "#242424"

menu:
  main:
    - name: "Posts"
      url: "/posts/"
      weight: 10
    - name: "Categories"
      url: "/categories/"
      weight: 20
    - name: "Photography"
      url: "/photography/"
      weight: 30
    - name: "Archives"
      url: "/archives/"
      weight: 40
    - name: "Search"
      url: "/search/"
      weight: 50
    - name: "About"
      url: "/about/"
      weight: 60
